services:
  - type: web
    name: doomsday
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: DOOMSDAY_DB_PATH
        value: /var/lib/doomsday/doomsday.sqlite3
      - key: SESSION_DAYS
        value: "30"
      - key: MOBILE_ALLOWED_ORIGINS
        value: "capacitor://localhost,https://localhost"
